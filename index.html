<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Security Checker</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b1120;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #111827;
            padding: 35px;
            border-radius: 18px;
            border: 1px solid #263244;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #9ca3af;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .password-box {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #374151;
            background: #0f172a;
            color: white;
            font-size: 16px;
            outline: none;
        }

        button {
            padding: 14px 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #2563eb;
            color: white;
            font-weight: bold;
        }

        .strength {
            margin-top: 25px;
        }

        .bar {
            width: 100%;
            height: 10px;
            background: #374151;
            border-radius: 10px;
            margin-top: 10px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            width: 0%;
            background: #22c55e;
            transition: 0.3s;
        }

        .checks {
            margin-top: 25px;
        }

        .check {
            padding: 10px 0;
            color: #9ca3af;
        }

        .check.valid {
            color: #22c55e;
        }

        .suggestion {
            margin-top: 25px;
            padding: 15px;
            background: #0f172a;
            border-radius: 10px;
            color: #d1d5db;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔐 Password Security Checker</h1>

        <p class="subtitle">
            Check how strong your password is
        </p>

        <label for="password">Enter a password</label>

        <div class="password-box">
            <input 
                type="password" 
                id="password" 
                placeholder="Enter password..."
            >

            <button onclick="togglePassword()">
                Show
            </button>
        </div>

        <div class="strength">

            <strong>Strength: <span id="strengthText">None</span></strong>

            <div class="bar">
                <div class="bar-fill" id="barFill"></div>
            </div>

        </div>

        <div class="checks">

            <div class="check" id="length">
                ❌ At least 8 characters
            </div>

            <div class="check" id="uppercase">
                ❌ Contains uppercase letter
            </div>

            <div class="check" id="lowercase">
                ❌ Contains lowercase letter
            </div>

            <div class="check" id="number">
                ❌ Contains a number
            </div>

            <div class="check" id="special">
                ❌ Contains a special character
            </div>

        </div>

        <div class="suggestion" id="suggestion">
            💡 Start typing a password to check its security.
        </div>

    </div>

    <script>

        const passwordInput = document.getElementById("password");

        passwordInput.addEventListener("input", checkPassword);

        function togglePassword() {

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
            } else {
                passwordInput.type = "password";
            }

        }

        function checkPassword() {

            const password = passwordInput.value;

            const hasLength = password.length >= 8;
            const hasUppercase = /[A-Z]/.test(password);
            const hasLowercase = /[a-z]/.test(password);
            const hasNumber = /[0-9]/.test(password);
            const hasSpecial = /[^A-Za-z0-9]/.test(password);

            updateCheck("length", hasLength, "At least 8 characters");
            updateCheck("uppercase", hasUppercase, "Contains uppercase letter");
            updateCheck("lowercase", hasLowercase, "Contains lowercase letter");
            updateCheck("number", hasNumber, "Contains a number");
            updateCheck("special", hasSpecial, "Contains a special character");

            let score = 0;

            if (hasLength) score++;
            if (hasUppercase) score++;
            if (hasLowercase) score++;
            if (hasNumber) score++;
            if (hasSpecial) score++;

            updateStrength(score);

        }

        function updateCheck(id, valid, text) {

            const element = document.getElementById(id);

            if (valid) {
                element.classList.add("valid");
                element.textContent = "✅ " + text;
            } else {
                element.classList.remove("valid");
                element.textContent = "❌ " + text;
            }

        }

        function updateStrength(score) {

            const strengthText = document.getElementById("strengthText");
            const barFill = document.getElementById("barFill");
            const suggestion = document.getElementById("suggestion");

            if (score === 0) {

                strengthText.textContent = "None";
                barFill.style.width = "0%";
                suggestion.textContent =
                    "💡 Start typing a password to check its security.";

            } else if (score <= 2) {

                strengthText.textContent = "Weak";
                barFill.style.width = "25%";
                suggestion.textContent =
                    "⚠️ Try making your password longer and add different types of characters.";

            } else if (score === 3) {

                strengthText.textContent = "Medium";
                barFill.style.width = "50%";
                suggestion.textContent =
                    "💡 Good start! Add more complexity to improve security.";

            } else if (score === 4) {

                strengthText.textContent = "Strong";
                barFill.style.width = "75%";
                suggestion.textContent =
                    "✅ Strong password. Consider making it even longer.";

            } else {

                strengthText.textContent = "Very Strong";
                barFill.style.width = "100%";
                suggestion.textContent =
                    "🛡️ Great! Your password meets all the basic security checks.";

            }

        }

    </script>

</body>
</html>
